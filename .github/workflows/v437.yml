name: patch-v437
on:
  push:
    paths:
      - '.github/workflows/v437.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v437.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("setStatus('✓ クリーン版 v4.34 起動。位置補正と相手比較補正を分離して時系列検証できます。','ok');","setStatus('✓ クリーン版 v4.36 起動。結果ページの着順表を最後まで読み取ります。','ok');")
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/patch_v437.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          assert 'Q→B順位悪化の的中馬診断' in s
          assert 'qToBRegressions' in s
          assert 'クリーン版 v4.37' in s
          PY
          node --check /tmp/app.js
      - name: Commit v4.37
        run: |
          rm .github/scripts/patch_v437.py
          rm .github/workflows/v437.yml
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/patch_v437.py .github/workflows/v437.yml
          git commit -m 'feat: add Q-to-B winner regression diagnostic'
          git push
