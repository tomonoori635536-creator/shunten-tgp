name: patch-v437
on:
  push:
    paths:
      - '.github/workflows/v437.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_v437.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          assert 'Q→B順位悪化の的中馬診断' in s
          assert 'qToBRegressions' in s
          PY
          node --check /tmp/app.js
      - name: Commit v4.37
        run: |
          rm .github/scripts/patch_v437.py
          rm .github/workflows/v437.yml
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/patch_v437.py .github/workflows/v437.yml
          git commit -m 'feat: add Q-to-B winner regression diagnostic'
          git push
