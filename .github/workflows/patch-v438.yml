name: patch-v438
on:
  push:
    paths:
      - '.github/workflows/patch-v438.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.38 patch
        run: python .github/scripts/patch_v438.py
      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          assert 'クリーン版 v4.38' in s
          assert 'bRescuedWinners' in s
          assert 'Q→Bで救った勝ち馬診断' in s
          PY
          node --check /tmp/app.js
      - name: Commit v4.38 and remove temporary files
        shell: bash
        run: |
          rm .github/scripts/patch_v438.py .github/workflows/patch-v438.yml
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/patch_v438.py .github/workflows/patch-v438.yml
          git commit -m 'feat: add B-rescued winner diagnostic'
          git push
