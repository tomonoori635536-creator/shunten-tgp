name: patch-v442
on:
  push:
    branches: [patch-v440]
    paths:
      - '.github/workflows/patch-v442.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python ../shunten-tgp/.github/scripts/patch_v442.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/shunten-v442.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/shunten-v442.js
      - name: Commit v4.42
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: segment horse past runs by profile and parse inner outer turf'
          git push origin HEAD:main
