name: patch-v423
on:
  push:
    paths:
      - '.github/workflows/patch-v423.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v423.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          assert 'クリーン版 v4.23：騎手の当日成績×Rパターン学習' in s
          assert 'function jockeyDayRacePattern' in s
          assert 'function dayJockeyContext' in s
          assert '当日R補正' in s
          assert '当日成績 × R' in s
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: learn jockey daily form by race number'
          git push
