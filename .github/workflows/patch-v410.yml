name: patch-v410
on:
  push:
    paths:
      - '.github/workflows/patch-v410.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function parseRaceCard(lines){')
          end = s.index('\nfunction dedupe(arr,keyFn)', start)
          new = r'''function parseRaceCard(lines){
            const out=[];
            const start=Math.max(0,lines.findIndex(x=>/発走/.test(x)));
            for(let sexIdx=start;sexIdx<lines.length;sexIdx++){
              if(!isSexAge(lines[sexIdx])) continue;
              let burdenIdx=-1;
              for(let j=sexIdx+1;j<Math.min(lines.length,sexIdx+5);j++){
                if(/^\d{2,3}(?:\.\d)?$/.test(lines[j])){burdenIdx=j;break}
              }
              if(burdenIdx<0) continue;
              let jockey='',jockeyIdx=-1;
              for(let j=burdenIdx+1;j<Math.min(lines.length,burdenIdx+5);j++){
                if(!isCardNoise(lines[j])&&looksJockey(lines[j])){jockey=lines[j];jockeyIdx=j;break}
              }
              if(!jockey) continue;
              let num=null,frame=null,name='';
              const backStart=Math.max(start,sexIdx-7),before=[];
              for(let j=backStart;j<sexIdx;j++){
                const v=String(lines[j]||'').trim();
                if(!v||isCardNoise(v)) continue;
                before.push({i:j,v});
              }
              for(let k=before.length-1;k>=0;k--){
                const v=before[k].v.replace(/\s+Image$/,'').trim();
                if(!/^\d+(?:\.\d+)?$/.test(v)&&!/^\d+\(.+\)$/.test(v)&&!/^愛知$/.test(v)){name=v;break}
              }
              if(!name||/^(取消|除外|中止)$/.test(name)) continue;
              const namePos=before.findIndex(x=>x.v.replace(/\s+Image$/,'').trim()===name);
              const nums=[],src=namePos>=0?before.slice(0,namePos):before;
              for(let k=src.length-1;k>=0;k--){
                const v=src[k].v;
                if(/^\d{1,2}$/.test(v)){
                  const n=Number(v);
                  if(n>=1&&n<=20) nums.push(n);
                  if(nums.length>=2) break;
                }else{
                  const m=v.match(/^([1-8])\s+([1-9]|1\d|2\d)$/);
                  if(m){nums.push(Number(m[2]),Number(m[1]));break}
                }
              }
              if(nums.length){num=nums[0];if(nums.length>1)frame=nums[1]}
              if(!num) continue;
              let boundary=lines.length;
              for(let j=sexIdx+1;j<lines.length;j++){
                if(isSexAge(lines[j])){boundary=j;break}
              }
              const scanEnd=Math.min(boundary,jockeyIdx+16,lines.length);
              let pop=null,odds=null;
              for(let j=jockeyIdx+1;j<scanEnd;j++){
                const cur=String(lines[j]||'').trim();
                let m=cur.match(/^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/);
                if(m){odds=Number(m[1]);pop=Number(m[2]);break}
                m=cur.match(/^(\d+)人気$/);
                if(m){pop=Number(m[1]);continue}
                if(/^\d+(?:\.\d+)?$/.test(cur)){
                  const n=Number(cur),next=String(lines[j+1]||'').trim();
                  if(/^\d{1,2}$/.test(next)){
                    const candidate=Number(next);
                    if(n>=1.0&&candidate>=1&&candidate<=20){odds=n;pop=candidate;break}
                  }
                  const pm=next.match(/^(\d+)人気$/);
                  if(pm&&n>=1.0){odds=n;pop=Number(pm[1]);break}
                }
              }
              out.push({frame,num,name,jockey,pop,odds,rank:null,sexAge:lines[sexIdx]});
            }
            return dedupe(out,r=>`${r.num}|${r.name}`);
          }'''
          s = s[:start] + new + s[end:]
          s = s.replace('クリーン版 v4.9：出馬表テーブル読取・騎手適性スコア','クリーン版 v4.10：出馬表の性齢アンカー読取')
          s = s.replace('✓ クリーン版 v4.9 起動。出馬表テーブル読取と騎手適性スコアに対応しました。','✓ クリーン版 v4.10 起動。出馬表を性齢アンカー方式で読み取ります。')
          p.write_text(s, encoding='utf-8')
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: robustly parse card rows from sex-age anchor'
          git push
