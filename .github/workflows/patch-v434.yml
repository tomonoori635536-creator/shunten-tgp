name: patch-v434
on:
  push:
    paths:
      - '.github/workflows/patch-v434.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v434.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.34：位置補正と相手比較を分離バックテスト' in s
          assert "{key:'p',name:'P ＋位置だけ',score:'scoreP'}" in s
          assert "{key:'q',name:'Q ＋相手比較だけ',score:'scoreQ'}" in s
          assert '位置 vs 相手比較 分離診断' in s
          assert 'scoreP=clampValue' in s
          assert 'scoreQ=clampValue' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: compare position and pair lineup effects'
          git push
