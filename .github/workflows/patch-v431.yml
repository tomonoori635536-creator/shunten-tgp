name: patch-v431
on:
  push:
    paths:
      - '.github/workflows/patch-v431.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v431.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.31：高配当1位の要因を分解診断' in s
          assert 'highPayoutDiagnostics' in s
          assert '高配当1位の要因診断' in s
          assert 'なぜ拾えたか' in s
          assert '並び補正' in s and '当日R補正' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: diagnose high payout top-ranked picks'
          git push
