name: patch-v428
on:
  push:
    paths:
      - '.github/workflows/patch-v428.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v428.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.28：馬55×騎手45も仮比較' in s
          assert "{key:'m55',name:'仮 55:45 馬55＋騎手45',score:'scoreM55'}" in s
          assert 'scoreM55:blend(0.55)' in s
          assert '55:45' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add provisional 55 45 horse jockey blend'
          git push
