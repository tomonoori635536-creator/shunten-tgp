name: patch-v413
on:
  push:
    paths:
      - '.github/workflows/patch-v413.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch card parser
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function parseRaceCard(lines){')
          end=s.index('\nfunction dedupe(arr,keyFn)',start)
          new=r'''function parseRaceCard(lines){
            const text=lines.join(' ').replace(/\s+/g,' ').trim();
            const out=[];
            const rowRe=/(?:^|\s)([1-8])\s+([1-9]|1\d|2\d)\s+(?:(?:--|\[Select\]|Select|印)\s+)*([^\s]+?)(?:\s+Image)?\s+((?:牡|牝|セ)\d+)\s+(\d{2,3}(?:\.\d)?)\s+([^\s]+)/g;
            const anchors=[];
            let m;
            while((m=rowRe.exec(text))){
              anchors.push({index:m.index,end:rowRe.lastIndex,frame:Number(m[1]),num:Number(m[2]),name:m[3],sexAge:m[4],burden:Number(m[5]),jockey:m[6]});
            }
            for(let i=0;i<anchors.length;i++){
              const a=anchors[i];
              const block=text.slice(a.end,i+1<anchors.length?anchors[i+1].index:Math.min(text.length,a.end+260));
              let pop=null,odds=null;
              let om=block.match(/\b\d{3}(?:\([+-]?\d+\))?\s+(\d+(?:\.\d+)?)\s+(\d{1,2})(?:人気)?\b/);
              if(om){
                odds=Number(om[1]);
                const candidate=Number(om[2]);
                if(candidate>=1&&candidate<=20)pop=candidate;
              }
              if(pop==null){
                om=block.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*\((\d{1,2})人気\)/);
                if(om){odds=Number(om[1]);pop=Number(om[2]);}
              }
              if(pop==null){
                const pm=block.match(/(?:^|\s)(\d{1,2})人気(?:\s|$)/);
                if(pm)pop=Number(pm[1]);
              }
              out.push({frame:a.frame,num:a.num,name:a.name,jockey:a.jockey,pop,odds,rank:null,sexAge:a.sexAge});
            }
            return dedupe(out,r=>`${r.num}|${r.name}`);
          }'''
          s=s[:start]+new+s[end:]
          s=s.replace('クリーン版 v4.12：出馬表本体だけを限定読取','クリーン版 v4.13：netkeiba出馬表本体を直接読取')
          s=s.replace('✓ クリーン版 v4.12 起動。出馬表本体だけを限定して読み取ります。','✓ クリーン版 v4.13 起動。netkeiba出馬表本体を直接読み取ります。')
          p.write_text(s,encoding='utf-8')
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: directly parse netkeiba race card rows'
          git push
