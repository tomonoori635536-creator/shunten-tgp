name: patch-v420
on:
  push:
    paths:
      - '.github/workflows/patch-v420.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v4.20
        run: python .github/scripts/patch_v420.py
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add save confirmation and automatic JSON backup'
          git push
