name: patch-v425
on:
  push:
    paths:
      - '.github/workflows/patch-v425.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v425.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.25：当日Rは学習継続・最終点から一時除外' in s
          assert '<th>当日R参考</th>' in s
          assert 'const finalScore=base==null?null:clampValue(base+lp.adj,0,100);' in s
          assert 'scoreC:clampValue(base+dp.adj,0,100)' in s
          assert 'scoreD:clampValue(base+lp.adj+dp.adj,0,100)' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: keep daily R learning as reference only'
          git push
