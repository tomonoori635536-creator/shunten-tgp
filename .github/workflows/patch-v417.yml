name: patch-v417
on:
  push:
    paths:
      - '.github/workflows/patch-v417.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch lineup pattern learning
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('クリーン版 v4.16：騎手適性を50点基準に再調整','クリーン版 v4.17：騎手の並びパターン学習を追加',1)
          marker='function scoreClass(score){'
          assert marker in s, 'scoreClass marker missing'
          helpers=r'''function clampValue(v,min,max){return Math.max(min,Math.min(max,v))}
function completeRacesBefore(targetDate){
  const target=dateNumber(targetDate);
  return (state.races||[]).filter(r=>{
    const d=dateNumber(r.meta?.date);
    return !target||(!d?false:d<target);
  });
}
function gateBandByNumber(num,fieldSize){
  const n=Number(num),f=Number(fieldSize);
  if(!Number.isFinite(n)||!Number.isFinite(f)||f<2)return '';
  const p=(n-0.5)/f;
  return p<=1/3?'内':p<=2/3?'中':'外';
}
function relativeSide(a,b){
  const x=Number(a),y=Number(b);
  if(!Number.isFinite(x)||!Number.isFinite(y)||x===y)return '';
  return x<y?'内側':'外側';
}
function jockeyLineupPattern(row,meta,cardRows){
  const races=completeRacesBefore(meta?.date);
  if(!row?.jockey||!races.length)return {adj:0,pairAdj:0,posAdj:0,pairMatches:0,pairOpponents:0,posN:0,label:'未学習',notes:[]};
  const currentField=(cardRows||[]).length;
  const currentBand=gateBandByNumber(row.num,currentField);
  const selfAll=[];
  const selfBand=[];
  for(const race of races){
    const rr=(race.rows||[]).find(x=>x.jockey===row.jockey&&Number.isFinite(Number(x.rank)));
    if(!rr)continue;
    const field=(race.rows||[]).filter(x=>Number.isFinite(Number(x.rank))).length;
    const enriched={...rr,fieldSize:field};
    selfAll.push(enriched);
    if(currentBand&&gateBandByNumber(rr.num,field)===currentBand)selfBand.push(enriched);
  }
  let posAdj=0;
  if(selfAll.length>=5&&selfBand.length>=3){
    const allScore=scoreRows(selfAll),bandScore=scoreRows(selfBand);
    if(allScore&&bandScore)posAdj=clampValue((bandScore.score-allScore.score)*0.35,-4,4);
  }
  let pairWeighted=0,pairWeight=0,pairMatches=0,pairOpponents=0;
  const notes=[];
  for(const opp of (cardRows||[])){
    if(!opp?.jockey||opp.jockey===row.jockey)continue;
    const targetSide=relativeSide(row.num,opp.num);
    if(!targetSide)continue;
    let n=0,ahead=0;
    for(const race of races){
      const rows=(race.rows||[]).filter(x=>Number.isFinite(Number(x.rank)));
      const me=rows.find(x=>x.jockey===row.jockey),other=rows.find(x=>x.jockey===opp.jockey);
      if(!me||!other)continue;
      if(relativeSide(me.num,other.num)!==targetSide)continue;
      n++;
      if(Number(me.rank)<Number(other.rank))ahead++;
    }
    if(n<2)continue;
    const rate=ahead/n;
    const shrink=n/(n+4);
    const edge=(rate-0.5)*16*shrink;
    const w=Math.min(4,Math.sqrt(n));
    pairWeighted+=edge*w;
    pairWeight+=w;
    pairMatches+=n;
    pairOpponents++;
    if(n>=3)notes.push(`${opp.jockey}に${targetSide} ${ahead}/${n}先着`);
  }
  const pairAdj=pairWeight?clampValue(pairWeighted/pairWeight,-6,6):0;
  const adj=clampValue(posAdj+pairAdj,-8,8);
  if(currentBand&&selfBand.length)notes.unshift(`${currentBand}寄り ${selfBand.length}鞍`);
  let label='蓄積あり';
  if(pairMatches===0&&selfBand.length<3)label='未学習';
  else if(pairMatches<4&&selfBand.length<5)label='サンプル少';
  else if(pairMatches<10&&selfBand.length<10)label='参考';
  return {adj,pairAdj,posAdj,pairMatches,pairOpponents,posN:selfBand.length,label,notes};
}
'''
          s=s.replace(marker,helpers+marker,1)
          start=s.index('function renderPreview(p){')
          end=s.index('\nfunction setStatus(',start)
          new_render=r'''function renderPreview(p){
  const m=p.meta||{},modeLabel=p.mode==='result'?'結果ページ':p.mode==='card'?'出馬表':'未判定';
  let html=`<div class="meta"><div class="chip"><b>モード</b><br>${esc(modeLabel)}</div><div class="chip"><b>日付</b><br>${esc(m.date||'不明')}</div><div class="chip"><b>競馬場</b><br>${esc(m.venue||'不明')}</div><div class="chip"><b>R</b><br>${m.raceNo??'不明'}</div><div class="chip"><b>条件</b><br>${esc(`${m.surface||'?'}${m.distance||'?'}m ${m.going||''}`)}</div></div>`;
  if(!p.rows?.length){html+=`<p class="warn">馬データを認識できませんでした。</p>`;$('preview').innerHTML=html;return}
  if(p.mode==='card'){
    html+=`<p class="muted">騎手適性は過去履歴から計算。並び補正は、完全保存された過去レースだけを使い「内・中・外」と同乗騎手に対する内側/外側の先着傾向を学習します。補正は最大±8点で、データが少ない間は主スコアを動かしすぎません。</p>`;
    html+=`<div class="tablewrap"><table><thead><tr><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th><th>騎手適性</th><th>並び補正</th><th>最終騎手</th><th>信頼度</th><th>並び学習</th><th>今回の一致データ</th></tr></thead><tbody>`;
    html+=p.rows.map(r=>{
      const q=jockeySuitability(r,m);
      const lp=jockeyLineupPattern(r,m,p.rows);
      const base=q.score==null?null:q.score;
      const finalScore=base==null?null:clampValue(base+lp.adj,0,100);
      const scoreText=base==null?'--':Math.round(base);
      const finalText=finalScore==null?'--':Math.round(finalScore);
      const adjText=lp.label==='未学習'?'--':`${lp.adj>0?'+':''}${lp.adj.toFixed(1)}`;
      const reason=q.reasons.length?q.reasons.join(' / '):`過去 ${q.total}鞍・条件一致なし`;
      const lineupText=lp.notes.length?lp.notes.slice(0,3).join(' / '):`位置 ${lp.posN}鞍 / 相手比較 ${lp.pairMatches}回`;
      return `<tr><td>${r.num??''}</td><td>${esc(r.name)}</td><td>${esc(r.jockey)}</td><td>${r.pop??'-'}</td><td>${r.odds??'-'}</td><td class="scoreCell ${scoreClass(base)}">${scoreText}</td><td class="scoreCell ${scoreClass(50+lp.adj)}">${adjText}</td><td class="scoreCell ${scoreClass(finalScore)}">${finalText}</td><td><span class="scoreFlag">${esc(q.label)}</span><div class="muted">過去${q.total}鞍 / 一致${q.matchCount}鞍</div></td><td class="scoreNote"><span class="scoreFlag">${esc(lp.label)}</span><div class="muted">${esc(lineupText)}</div></td><td class="scoreNote">${esc(reason)}</td></tr>`;
    }).join('');
    html+=`</tbody></table></div>`;
  }else{
    html+=`<div class="tablewrap"><table><thead><tr><th>着</th><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td>${r.rank??'-'}</td><td>${r.num??''}</td><td>${esc(r.name)}</td><td>${esc(r.jockey)}</td><td>${r.pop??'-'}</td><td>${r.odds??'-'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  $('preview').innerHTML=html;
}'''
          s=s[:start]+new_render+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add conservative jockey lineup pattern learning'
          git push
