name: fix-v436
on:
  push:
    paths:
      - '.github/workflows/fix-v436.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch parser boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const boundary=lines.findIndex(s=>/^(?:レース映像|払戻金|払戻し|コーナー通過順位)$/.test(String(s||'').trim()));"
          new="const boundary=lines.findIndex(s=>/^(?:払戻金|払戻し|コーナー通過順位)$/.test(String(s||'').trim()));"
          assert old in s, 'old result boundary not found'
          s=s.replace(old,new,1)
          old_head='<p>クリーン版 v4.35：v4.34分離BT＋netkeiba結果横表対応</p>'
          new_head='<p>クリーン版 v4.36：結果ページ上部のレース映像タブ誤判定を修正</p>'
          assert old_head in s, 'v4.35 header not found'
          s=s.replace(old_head,new_head,1)
          old_boot="setStatus('✓ クリーン版 v4.34 起動。位置補正と相手比較補正を分離して時系列検証できます。','ok')"
          new_boot="setStatus('✓ クリーン版 v4.36 起動。結果ページの着順表を最後まで読み取ります。','ok')"
          if old_boot in s:
              s=s.replace(old_boot,new_boot,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          assert 'レース映像|払戻金' not in s
          assert 'クリーン版 v4.36' in s
          PY
          node --check /tmp/app.js
      - name: Commit final update
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-v436.yml
          git add index.html
          git commit -m "fix: read copied netkeiba result pages through result table"
          git push origin HEAD:main
