name: patch-v429
on:
  push:
    paths:
      - '.github/workflows/patch-v429.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v429.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.29：単勝回収率も仮検証' in s
          assert 'roiN:0,stake:0,returnYen:0' in s
          assert '確定単勝回収率' in s
          assert 'st.returnYen+=Math.round(winOdds*100)' in s
          assert '単勝 ${x.odds??\'-\'}' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add provisional win ROI backtest'
          git push
