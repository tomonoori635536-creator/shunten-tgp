name: patch-v440
on:
  push:
    branches: [patch-v440]
    paths:
      - '.github/workflows/patch-v440.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep patch script and switch to main
        run: |
          cp .github/scripts/patch_v440.py /tmp/patch_v440.py
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Patch index
        run: python /tmp/patch_v440.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Verify v4.40 anchors
        run: |
          grep -F 'クリーン版 v4.40：馬能力は今回貼付の馬柱だけで評価' index.html
          grep -F 'const hs=horseAbility(r,m,p.pastRuns);' index.html
          grep -F '<th>今回馬柱</th>' index.html
      - name: Commit once to main
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: use current pasted horse card for live horse ability'
          git push origin HEAD:main
