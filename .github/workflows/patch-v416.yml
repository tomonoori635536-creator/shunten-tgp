name: patch-v416
on:
  push:
    paths:
      - '.github/workflows/patch-v416.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recalibrate jockey score
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function scoreRows(rows){')
          end=s.index('\nfunction jockeySuitability(',start)
          new=r'''function scoreRows(rows){
            const n=rows.length;if(!n)return null;
            let wins=0,places=0,popCount=0,popDiff=0,expWinSum=0,expPlaceSum=0;
            for(const r of rows){
              const rank=Number(r.rank);
              if(rank===1)wins++;
              if(rank<=3)places++;
              const field=Number(r.fieldSize);
              expWinSum+=Number.isFinite(field)&&field>=2?1/field:0.10;
              expPlaceSum+=Number.isFinite(field)&&field>=3?Math.min(3,field)/field:0.30;
              const pop=Number(r.pop);
              if(r.pop!==null&&r.pop!==''&&Number.isFinite(pop)&&pop>=1){
                popCount++;popDiff+=pop-rank;
              }
            }
            const winRate=wins/n,placeRate=places/n;
            const expWin=expWinSum/n,expPlace=expPlaceSum/n;
            let perfScore=50+(winRate-expWin)*120+(placeRate-expPlace)*70;
            perfScore=Math.max(15,Math.min(85,perfScore));
            let raw=perfScore;
            if(popCount){
              const avgDiff=popDiff/popCount;
              const popScore=Math.max(15,Math.min(85,50+avgDiff*6));
              raw=perfScore*0.55+popScore*0.45;
            }
            const shrink=n/(n+8);
            const score=50+(raw-50)*shrink;
            return {score:Math.max(0,Math.min(100,score)),n,wins,places,popCount};
          }'''
          s=s[:start]+new+s[end:]
          s=s.replace("function scoreClass(score){if(score==null)return '';return score>=65?'scoreGood':score>=50?'scoreMid':'scoreLow'}","function scoreClass(score){if(score==null)return '';return score>=60?'scoreGood':score>=45?'scoreMid':'scoreLow'}",1)
          s=s.replace('騎手適性は保存済みの過去結果だけで計算します。50点前後が中立です。「サンプル少」は参考扱いです。','騎手適性は保存済みの過去結果だけで計算します。50点前後=普通 / 60点以上=好相性 / 70点以上=かなり強い。「サンプル少」は参考扱いです。',1)
          s=s.replace('クリーン版 v4.15：過去馬柱973騎乗を学習データとして取込対応','クリーン版 v4.16：騎手適性を50点基準に再調整',1)
          p.write_text(s,encoding='utf-8')
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: recalibrate jockey suitability around neutral 50'
          git push
