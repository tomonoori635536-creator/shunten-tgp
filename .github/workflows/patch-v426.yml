name: patch-v426
on:
  push:
    paths:
      - '.github/workflows/patch-v426.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v426.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.26：馬能力スコア土台＋時系列検証' in s
          assert 'function horseAbility(row,meta)' in s
          assert '直近3走40%' in s
          assert "{key:'h',name:'H 馬能力のみ',score:'scoreH'}" in s
          assert '<th>馬能力</th>' in s
          assert '馬能力と騎手はまだ混ぜません' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add chronological horse ability scoring'
          git push
