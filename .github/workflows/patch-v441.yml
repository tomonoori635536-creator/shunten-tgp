name: patch-v441
on:
  push:
    branches: [patch-v440]
    paths:
      - '.github/workflows/patch-v441.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch patch script
        run: |
          curl -fsSL https://raw.githubusercontent.com/tomonoori635536-creator/shunten-tgp/patch-v440/.github/scripts/patch_v441.py -o /tmp/patch_v441.py
      - name: Apply patch
        run: python /tmp/patch_v441.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Verify patch
        run: |
          grep -F 'クリーン版 v4.41' index.html
          grep -F 'pastRuns:Array.isArray(parsed.pastRuns)?parsed.pastRuns:[]' index.html
          grep -F 'Array.isArray(card.pastRuns)&&card.pastRuns.length?card.pastRuns:null' index.html
      - name: Commit to main
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: snapshot pasted horse runs for live and backtest ability'
          git push origin HEAD:main
