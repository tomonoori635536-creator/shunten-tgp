name: patch-v427
on:
  push:
    paths:
      - '.github/workflows/patch-v427.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v427.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'クリーン版 v4.27：馬×騎手の比率を仮比較' in s
          for key in ['scoreM50','scoreM60','scoreM70','scoreM80']:
              assert key in s
          assert '比率はまだ仮です' in s
          assert '実戦表示の最終点にはまだ採用しません' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add provisional horse jockey blend backtest'
          git push
