<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鞍上パターン帳 × 瞬天 TGP ENGINE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f9;color:#18212b}header{background:#101820;color:#fff;padding:18px 20px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#b8c5d1}main{max-width:1180px;margin:20px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}textarea{width:100%;min-height:340px;padding:12px;border:1px solid #cbd3da;border-radius:8px;resize:vertical;font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#101820;color:#fff}.secondary{background:#e9eef2;color:#17202a}.status{margin-top:12px;padding:12px;border-radius:8px;background:#eef3f7;white-space:pre-wrap}.ok{color:#137944}.warn{color:#a05c00}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.chip{border:1px solid #dbe1e6;border-radius:8px;padding:10px;background:#fafbfc}.tablewrap{overflow:auto;max-height:520px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e7ebee;text-align:left;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0}.muted{color:#66727d;font-size:13px}input{padding:8px;border:1px solid #cbd3da;border-radius:7px}
</style>
</head>
<body>
<header>
<h1>🏇 鞍上パターン帳 × 瞬天 TGP ENGINE</h1>
<p>クリーン版 v1：まず「読取」を確実にする</p>
</header>

<main>
<section class="panel">
<h2>データ入力</h2>
<p>netkeiba / NAR の出馬表または結果ページを、そのまま貼り付けてください。</p>

<div class="row">
<label>データ収集年
<input id="year" type="number" min="2000" max="2100" value="2026" style="width:100px">
</label>
<span class="muted">MM/DDだけのページの日付補完に使います</span>
</div>

<textarea id="raw" placeholder="ここにページ全文を貼り付け"></textarea>

<div class="row">
<button class="btn primary" id="parseBtn">今すぐ読み取る</button>
<button class="btn primary" id="saveBtn" disabled>この結果を保存</button>
<button class="btn secondary" id="clearBtn">入力だけ消す</button>
</div>

<div id="status" class="status">待機中</div>
<div id="preview"></div>
</section>
</main>

<script>
const KEY='jockeyPatternBook_v2';
const YEAR_KEY='jockeyPatternBook_collectionYear';
let parsed=null;

const $=id=>document.getElementById(id);
const norm=s=>String(s??'').replace(/\u3000/g,' ').replace(/\s+/g,' ').trim();
const linesOf=raw=>String(raw||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);

const venues=[
'名古屋','園田','門別','船橋','大井','金沢','高知','佐賀','笠松',
'姫路','盛岡','水沢','浦和','川崎','帯広',
'札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'
];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[c]));

function headerWindow(lines){
  let start=lines.findIndex(x=>x==='前');
  if(start<0) start=0;

  let end=lines.findIndex(x=>/発走/.test(x));

  if(end<0){
    end=Math.min(lines.length,160);
  }else{
    end=Math.min(lines.length,end+8);
  }

  return lines.slice(start,end);
}

function parseDate(lines){
  const year=Number($('year').value)||new Date().getFullYear();
  const head=headerWindow(lines);

  // 重要: 過去走の日付を拾わない。現在レースのヘッダー部分だけを見る。
  const full=head.join(' ').match(
    /(20\d{2})[.\/年](\d{1,2})[.\/月](\d{1,2})/
  );

  if(full){
    return `${full[1]}/${String(full[2]).padStart(2,'0')}/${String(full[3]).padStart(2,'0')}`;
  }

  // MM/DD の日付ナビがある場合は、本日へ に最も近い日付を優先。
  const nav=[];
  for(let i=0;i<head.length;i++){
    const m=head[i].match(/^(\d{1,2})\/(\d{1,2})\([^)]*\)$/);
    if(m) nav.push({i,month:+m[1],day:+m[2]});
  }

  if(nav.length){
    const todayIdx=head.findIndex(x=>x==='本日へ');
    let pick=null;

    if(todayIdx>=0){
      const before=nav.filter(x=>x.i<todayIdx);
      if(before.length) pick=before[before.length-1];
    }

    if(!pick){
      pick=nav[Math.floor(nav.length/2)];
    }

    return `${year}/${String(pick.month).padStart(2,'0')}/${String(pick.day).padStart(2,'0')}`;
  }

  return '';
}

function parseRaceNo(lines){
  const head=headerWindow(lines);
  const idx12=head.findIndex(x=>x==='12R');

  if(idx12>=0){
    for(let i=idx12+1;i<Math.min(head.length,idx12+20);i++){
      if(/^\d{1,2}R$/.test(head[i])){
        return Number(head[i].slice(0,-1));
      }
    }
  }

  for(let i=0;i<head.length;i++){
    if(
      /^\d{1,2}R$/.test(head[i]) &&
      head.slice(i+1,i+4).some(x=>/発走/.test(x))
    ){
      return Number(head[i].slice(0,-1));
    }
  }

  return null;
}

function parseVenue(lines){
  const head=headerWindow(lines);

  // 「7回 名古屋 3日目」の開催行を最優先
  for(const s of head){
    const m=s.match(
      new RegExp(`^\\d+回\\s+(${venues.join('|')})\\s+\\d+日目`)
    );

    if(m) return m[1];
  }

  // 開催行がなければ発走時刻の周辺だけを見る
  const hi=head.findIndex(x=>/発走/.test(x));

  const near=hi>=0
    ?head.slice(Math.max(0,hi-8),Math.min(head.length,hi+8))
    :head.slice(0,80);

  for(const s of near){
    if(venues.includes(s)){
      return s;
    }
  }

  return '';
}

function parseMeta(lines){
  const head=headerWindow(lines);
  const joined=head.join(' ');
  const hi=head.findIndex(x=>/発走/.test(x));

  const sd=joined.match(
    /(?:^|\s)(芝|ダ|障)\s*(\d{3,4})m/
  );

  const going=(
    joined.match(
      /(?:馬場|馬場状態)[:：]?\s*(良|稍重|重|不良|稍|不)/
    )||[]
  )[1]||'';

  let raceName='';

  if(hi>0){
    for(let i=hi-1;i>=Math.max(0,hi-4);i--){
      const s=head[i];

      if(
        !/^\d{1,2}R$/.test(s) &&
        !/^(前|次|本日へ)$/.test(s)
      ){
        raceName=s;
        break;
      }
    }
  }

  return {
    date:parseDate(lines),
    venue:parseVenue(lines),
    raceNo:parseRaceNo(lines),
    surface:sd?sd[1]:'',
    distance:sd?Number(sd[2]):null,
    going,
    raceName
  };
}

function isSexAge(s){
  return /^(牡|牝|セ)\d+/.test(s);
}

function looksJockey(s){
  return s &&
    !/^\d/.test(s) &&
    !/(映像を見る|着差|タイム|人気|馬体重)/.test(s);
}

function parseResultRows(lines){
  const out=[];

  for(let i=0;i<lines.length-7;i++){

    if(!/^\d{1,2}$/.test(lines[i])) continue;

    const rank=Number(lines[i]);

    if(rank<1||rank>30) continue;

    let p=i+1;

    if(/^\d$/.test(lines[p])){
      p++;
    }

    if(!/^\d{1,2}$/.test(lines[p])) continue;

    const num=Number(lines[p++]);
    const name=lines[p++];
    const sexAge=lines[p++];

    if(!name||!isSexAge(sexAge)) continue;

    const burden=lines[p++];
    const jockey=lines[p++];

    if(
      !/^\d{2,3}(?:\.\d)?$/.test(burden) ||
      !looksJockey(jockey)
    ){
      continue;
    }

    let pop=null;
    let odds=null;
    let time='';

    for(let j=p;j<Math.min(lines.length,p+20);j++){

      if(
        !time &&
        /^\d+:\d{2}(?:\.\d)?$/.test(lines[j])
      ){
        time=lines[j];
      }

      let m=lines[j].match(
        /^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/
      );

      if(m){
        odds=+m[1];
        pop=+m[2];
      }

      m=lines[j].match(/^(\d+)人気$/);

      if(m){
        pop=+m[1];
      }
    }

    out.push({
      rank,
      num,
      name,
      jockey,
      pop,
      odds,
      time
    });

    i=p-1;
  }

  return dedupe(
    out,
    r=>`${r.rank}|${r.num}|${r.name}`
  );
}

function parseRaceCard(lines){
  const out=[];
  const start=Math.max(
    0,
    lines.findIndex(x=>/発走/.test(x))
  );

  for(let i=start;i<lines.length-8;i++){

    const m=lines[i].match(
      /^([1-8])\s+([1-9]|1\d|2\d)\s*$/
    );

    if(!m) continue;

    const frame=+m[1];
    const num=+m[2];

    let p=i+1;

    if(lines[p]==='--'){
      p++;
    }

    const name=lines[p++];

    if(
      !name ||
      /^(取消|除外|中止)$/.test(name)
    ){
      continue;
    }

    let pop=null;
    let odds=null;
    let sexAge='';
    let jockey='';

    for(let j=p;j<Math.min(lines.length,p+18);j++){

      let pm=lines[j].match(
        /^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/
      );

      if(pm){
        odds=+pm[1];
        pop=+pm[2];
      }

      if(
        !sexAge &&
        /^(牡|牝|セ)\d+/.test(lines[j])
      ){
        sexAge=lines[j];
      }

      if(
        sexAge &&
        !jockey &&
        j>p &&
        looksJockey(lines[j]) &&
        /^\d{2,3}(?:\.\d)?$/.test(lines[j+1]||'')
      ){
        jockey=lines[j];
      }
    }

    if(name && (sexAge||jockey)){
      out.push({
        frame,
        num,
        name,
        jockey,
        pop,
        odds,
        rank:null
      });
    }
  }

  return dedupe(
    out,
    r=>`${r.num}|${r.name}`
  );
}

function dedupe(arr,keyFn){
  const seen=new Set();

  return arr.filter(x=>{
    const k=keyFn(x);

    if(seen.has(k)){
      return false;
    }

    seen.add(k);
    return true;
  });
}

function parseAll(raw){
  const lines=linesOf(raw);

  if(!lines.length){
    return {error:'入力が空です'};
  }

  const meta=parseMeta(lines);
  const resultRows=parseResultRows(lines);

  const cardRows=resultRows.length>=3
    ?[]
    :parseRaceCard(lines);

  const mode=
    resultRows.length>=3
    ?'result'
    :cardRows.length
      ?'card'
      :'unknown';

  return {
    meta,
    mode,
    rows:mode==='result'?resultRows:cardRows,
    lines
  };
}

function renderPreview(p){
  const m=p.meta||{};

  const modeLabel=
    p.mode==='result'
      ?'結果ページ'
      :p.mode==='card'
        ?'出馬表'
        :'未判定';

  let html=`<div class="meta">
  <div class="chip"><b>モード</b><br>${esc(modeLabel)}</div>
  <div class="chip"><b>日付</b><br>${esc(m.date||'不明')}</div>
  <div class="chip"><b>競馬場</b><br>${esc(m.venue||'不明')}</div>
  <div class="chip"><b>R</b><br>${m.raceNo??'不明'}</div>
  <div class="chip"><b>条件</b><br>${esc((m.surface||'')+(m.distance?m.distance+'m ':'')+(m.going||''))}</div>
  <div class="chip"><b>レース名</b><br>${esc(m.raceName||'')}</div>
  </div>`;

  if(p.rows?.length){

    html+=`
    <div class="tablewrap">
    <table>
    <tr>
    <th>着</th>
    <th>馬番</th>
    <th>馬名</th>
    <th>騎手</th>
    <th>人気</th>
    </tr>
    ${
      p.rows.map(r=>`
      <tr>
      <td>${r.rank??''}</td>
      <td>${r.num??''}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.jockey)}</td>
      <td>${r.pop??''}</td>
      </tr>
      `).join('')
    }
    </table>
    </div>`;
  }

  $('preview').innerHTML=html;
}

function setStatus(text,cls=''){
  $('status').className='status '+cls;
  $('status').textContent=text;
}

$('parseBtn').addEventListener('click',()=>{

  parsed=parseAll($('raw').value);

  $('saveBtn').disabled=true;

  if(parsed.error){
    setStatus(parsed.error,'warn');
    $('preview').innerHTML='';
    return;
  }

  renderPreview(parsed);

  const m=parsed.meta;
  const okMeta=m.venue&&m.raceNo&&m.date;
  const count=parsed.rows?.length||0;

  if(
    parsed.mode==='result' &&
    count>0
  ){
    setStatus(
      `✓ 結果として読取: ${m.date} ${m.venue} ${m.raceNo}R / ${count}頭
内容を確認して正しければ保存できます。`,
      'ok'
    );

    $('saveBtn').disabled=!okMeta;

  }else if(parsed.mode==='card'){

    setStatus(
      `✓ 出馬表として読取: ${m.date} ${m.venue} ${m.raceNo}R / ${count}頭
出馬表は保存せず、まず読取確認だけ行います。`,
      'ok'
    );

  }else{

    setStatus(
      `読取できませんでした。
日付=${m.date||'?'} 競馬場=${m.venue||'?'} R=${m.raceNo||'?'} / 行数=${parsed.lines.length}`,
      'warn'
    );
  }
});

$('saveBtn').addEventListener('click',()=>{

  if(
    !parsed ||
    parsed.mode!=='result' ||
    !parsed.rows.length
  ){
    return;
  }

  let state={
    history:[],
    races:[],
    horseHistory:[],
    raceCards:[],
    evaluations:[],
    model:{}
  };

  try{
    const old=JSON.parse(
      localStorage.getItem(KEY)||'null'
    );

    if(
      old &&
      typeof old==='object'
    ){
      state=Object.assign(state,old);
    }
  }catch(e){}

  const key=[
    parsed.meta.date,
    parsed.meta.venue,
    parsed.meta.raceNo
  ].join('|');

  const obj={
    meta:parsed.meta,
    rows:parsed.rows,
    savedAt:new Date().toISOString()
  };

  const idx=(state.races||[]).findIndex(
    r=>[
      r.meta?.date,
      r.meta?.venue,
      r.meta?.raceNo
    ].join('|')===key
  );

  if(idx>=0){
    state.races[idx]=obj;
  }else{
    state.races.push(obj);
  }

  state.history=state.races.flatMap(
    r=>(r.rows||[]).map(
      x=>({...x,...r.meta})
    )
  );

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  setStatus(
    `✓ 保存しました: ${parsed.meta.date} ${parsed.meta.venue} ${parsed.meta.raceNo}R / ${parsed.rows.length}頭`,
    'ok'
  );
});

$('clearBtn').addEventListener('click',()=>{
  $('raw').value='';
  $('preview').innerHTML='';
  parsed=null;
  $('saveBtn').disabled=true;
  setStatus('入力欄だけ消しました');
});

(function boot(){

  const y=
    localStorage.getItem(YEAR_KEY)
    ||new Date().getFullYear();

  $('year').value=y;

  $('year').addEventListener(
    'change',
    e=>localStorage.setItem(
      YEAR_KEY,
      e.target.value
    )
  );

  setStatus(
    '✓ クリーン版 v1 起動。まずは「今すぐ読み取る」で確認してください。',
    'ok'
  );

})();
</script>
</body>
</html>
