d;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.patternCard{background:#fff;border:1px solid #dfe5ea;border-radius:10px;padding:12px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8eef3;font-size:12px;margin-left:6px}.strong{font-weight:800;color:#0d6b3f}.scoreCell{font-size:18px;font-weight:800}.scoreGood{color:#0d6b3f}.scoreMid{color:#7a5a00}.scoreLow{color:#8a3333}.scoreNote{font-size:12px;color:#66727d;white-space:normal;min-width:170px}.scoreFlag{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef3f7;font-size:12px;font-weight:700}

<body>

<script>
const KEY='jockeyPatternBook_v2';
const YEAR_KEY='jockeyPatternBook_collectionYear';
let parsed=null;
let state=loadState();
function emptyState(){return {history:[],seedHistory:[],races:[],horseHistory:[],raceCards:[],evaluations:[],model:{}}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?Object.assign(emptyState(),x):emptyState()}catch(e){return emptyState()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function rebuildHistory(){const live=(state.races||[]).flatMap(r=>(r.rows||[]).map(x=>({...x,...(r.meta||{})})));const seed=Array.isArray(state.seedHistory)?state.seedHistory:[];const seen=new Set();state.history=[...live,...seed].filter(r=>{const k=[r.date||'',r.venue||'',r.name||'',r.num??'',r.jockey||'',r.rank??''].join('|');if(seen.has(k))return false;seen.add(k);return true});persist()}
const $=id=>document.getElementById(id);
function cleanPasteToken(s){
  return String(s??'')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/\*\*|__/g,'')
    .replace(/`/g,'')
    .replace(/<br\s*\/?>/gi,' ')
    .replace(/&nbsp;/gi,' ')
    .replace(/^[*+\-]\s+/,'')
    .trim();
}
function linesOf(raw){
  const out=[];
  for(const rawLine of String(raw||'').replace(/\r/g,'').split('\n')){
    const line=rawLine.trim();
    if(!line) continue;
    let parts;
    if((line.match(/\|/g)||[]).length>=3) parts=line.split('|');
    else if(line.includes('\t')) parts=line.split('\t');
    else parts=[line];
    for(const part of parts){
      const t=cleanPasteToken(part);
      if(t) out.push(t);
    }
  }
  return out;
}
const venues=['名古屋','園田','門別','船橋','大井','金沢','高知','佐賀','笠松','姫路','盛岡','水沢','浦和','川崎','帯広','札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function headerWindow(lines){let start=lines.findIndex(x=>x==='前');if(start<0) start=0;let end=lines.findIndex(x=>/発走/.test(x));if(end<0){end=Math.min(lines.length,160)}else{end=Math.min(lines.length,end+8)}return lines.slice(start,end)}
function parseDate(lines){
  const year=Number($('year').value)||new Date().getFullYear();
  const head=headerWindow(lines);
  const nav=[];
  for(const s of head){const m=s.match(/^(\d{1,2})\/(\d{1,2})\([^)]*\)$/);if(m) nav.push({month:+m[1],day:+m[2]})}
  if(nav.length){const pick=nav[Math.floor(nav.length/2)];return `${year}/${String(pick.month).padStart(2,'0')}/${String(pick.day).padStart(2,'0')}`}
  const full=head.join(' ').match(/(20\d{2})[.\/年](\d{1,2})[.\/月](\d{1,2})/);
  if(full){return `${full[1]}/${String(full[2]).padStart(2,'0')}/${String(full[3]).padStart(2,'0')}`}
  return '';
}
function parseRaceNo(lines){
  const head=headerWindow(lines);const idx12=head.findIndex(x=>x==='12R');
  if(idx12>=0){for(let i=idx12+1;i<Math.min(head.length,idx12+20);i++){if(/^\d{1,2}R$/.test(head[i])) return Number(head[i].slice(0,-1))}}
  for(let i=0;i<head.length;i++){if(/^\d{1,2}R$/.test(head[i])&&head.slice(i+1,i+4).some(x=>/発走/.test(x))) return Number(head[i].slice(0,-1))}
  return null;
}
function parseVenue(lines){
  const head=headerWindow(lines);
  for(const s of head){const m=s.match(new RegExp(`^\\d+回\\s+(${venues.join('|')})\\s+\\d+日目`));if(m) return m[1]}
  const hi=head.findIndex(x=>/発走/.test(x));const near=hi>=0?head.slice(Math.max(0,hi-8),Math.min(head.length,hi+8)):head.slice(0,80);
  for(const s of near){if(venues.includes(s)) return s}return '';
}
function parseMeta(lines){
  const head=headerWindow(lines),joined=head.join(' '),hi=head.findIndex(x=>/発走/.test(x));
  const sd=joined.match(/(?:^|\s)(芝|ダ|障)\s*(\d{3,4})m/);
  const going=(joined.match(/(?:馬場|馬場状態)[:：]?\s*(良|稍重|重|不良|稍|不)/)||[])[1]||'';
  let raceName='';if(hi>0){for(let i=hi-1;i>=Math.max(0,hi-4);i--){const s=head[i];if(!/^\d{1,2}R$/.test(s)&&!/^(前|次|本日へ)$/.test(s)){raceName=s;break}}}
  return {date:parseDate(lines),venue:parseVenue(lines),raceNo:parseRaceNo(lines),surface:sd?sd[1]:'',distance:sd?Number(sd[2]):null,going,raceName};
}
function isSexAge(s){return /^(牡|牝|セ)\d+/.test(s)}
function looksJockey(s){return s&&!/^\d/.test(s)&&!/(映像を見る|着差|タイム|人気|馬体重)/.test(s)}
function parseResultRows(lines){
  const out=[];
  for(let i=0;i<lines.length-7;i++){
    if(!/^\d{1,2}$/.test(lines[i])) continue;
    const rank=Number(lines[i]);if(rank<1||rank>30) continue;
    let p=i+1;
    if(/^\d$/.test(lines[p])) p++;
    if(!/^\d{1,2}$/.test(lines[p])) continue;
    const num=Number(lines[p++]),name=lines[p++],sexAge=lines[p++];
    if(!name||!isSexAge(sexAge)) continue;
    const burden=lines[p++],jockey=lines[p++];
    if(!/^\d{2,3}(?:\.\d)?$/.test(burden)||!looksJockey(jockey)) continue;
    let pop=null,odds=null,time='',timeIndex=-1;
    const end=Math.min(lines.length,p+18);
    for(let j=p;j<end;j++){
      if(!time&&/^\d+:\d{2}(?:\.\d)?$/.test(lines[j])){time=lines[j];timeIndex=j}
      let m=lines[j].match(/^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/);
      if(m){odds=Number(m[1]);pop=Number(m[2]);break}
      m=lines[j].match(/^(\d+)人気$/);
      if(m&&pop==null) pop=Number(m[1]);
    }
    if(timeIndex>=0){
      for(let j=timeIndex+1;j<Math.min(end,timeIndex+7);j++){
        if(!/^\d{1,2}$/.test(lines[j])) continue;
        const candidate=Number(lines[j]);
        if(candidate<1||candidate>30) continue;
        const next=lines[j+1]||'';
        if(/^\d+(?:\.\d+)$/.test(next)){pop=candidate;odds=Number(next);break}
      }
    }
    out.push({rank,num,name,jockey,pop,odds,time});i=p-1;
  }
  return dedupe(out,r=>`${r.rank}|${r.num}|${r.name}`);
}
function isCardNoise(s){
  return !s||/^(?:--|印|登録|グループ|編集|馬メモ|切替)$/.test(s)||/^\[(?:Select|Input|Button:.*)\]$/.test(s);
}
function cardRowStartAt(lines,i){
  const joined=String(lines[i]||'').match(/^([1-8])\s+([1-9]|1\d|2\d)\s*$/);
  if(joined)return {frame:Number(joined[1]),num:Number(joined[2]),p:i+1};
  if(/^[1-8]$/.test(lines[i]||'')&&/^([1-9]|1\d|2\d)$/.test(lines[i+1]||'')){
    return {frame:Number(lines[i]),num:Number(lines[i+1]),p:i+2};
  }
  return null;
}
function hasSexAgeSoon(lines,p){
  for(let j=p;j<Math.min(lines.length,p+8);j++)if(isSexAge(lines[j]))return j;
  return -1;
}
function nextCardRowIndex(lines,from){
  for(let i=from;i<lines.length-1;i++){
    const st=cardRowStartAt(lines,i);if(!st)continue;
    if(hasSexAgeSoon(lines,st.p)>=0)return i;
  }
  return lines.length;
}
function findCardTableStart(lines){
  for(let i=0;i<lines.length;i++){
    const near=lines.slice(i,i+14).join(' ');
    if(/馬名/.test(near)&&/性齢/.test(near)&&/斤量/.test(near)&&/騎手/.test(near)&&/馬体重/.test(near)&&/人気/.test(near))return i;
  }
  return -1;
}
function resolveCardJockey(name){
  const base=String(name||'').replace(/^[▲△◇☆★]+/,'').trim();
  const aliases={
    '大畑雅':'大畑雅章','加藤誓':'加藤誓二','丹羽克':'丹羽克輝','大原浩':'大原浩司',
    '近藤颯':'近藤颯羽','丸野勝':'丸野勝虎','細川智':'細川智史','塚本征':'塚本征吾',
    '木之前':'木之前葵','木之葵':'木之前葵','今井貴':'今井貴大','大畑慧':'大畑慧悟'
  };
  const names=[...new Set((state.history||[]).map(r=>String(r.jockey||'').replace(/^[▲△◇☆★]+/,'').trim()).filter(Boolean))];
  if(names.includes(base))return base;
  const hits=names.filter(n=>n.startsWith(base)||base.startsWith(n));
  if(hits.length===1)return hits[0];
  return aliases[base]||base;
}
function parsePastCard(lines){
  const out=[];
  const trainerRe=/^(?:愛知|兵庫|北海道|高知|佐賀|笠松|岩手|船橋|浦和|川崎|大井|金沢|名古屋|園田)[・･]/;
  const noiseRe=/^(?:--|\[Select\]|Select|印|Image|映像を見る|登録|グループ|編集|馬メモ|切替)$/;
  for(let i=0;i<lines.length;i++){
    const line=String(lines[i]||'').trim();
    const om=line.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*\((\d{1,2})人気\)(?:\s|$)/);
    if(!om)continue;
    const odds=Number(om[1]),pop=Number(om[2]);
    let sexIdx=-1,sexAge='',jockey='';
    for(let j=i+1;j<Math.min(lines.length,i+6);j++){
      const v=String(lines[j]||'').replace(/^\|\s*/,'').trim();
      const sm=v.match(/^((?:牡|牝|セ)\d+\S*)\s+(.+)$/);
      if(sm){sexIdx=j;sexAge=sm[1];jockey=sm[2].trim();break}
      if(/^(?:牡|牝|セ)\d+\S*$/.test(v)){
        for(let k=j+1;k<Math.min(lines.length,j+3);k++){
          const n=String(lines[k]||'').trim();
          if(n&&!/^\d{2,3}(?:\.\d)?$/.test(n)){sexIdx=j;sexAge=v;jockey=n;break}
        }
        if(jockey)break;
      }
    }
    if(!jockey)continue;
    let trainerIdx=-1;
    for(let j=i-1;j>=Math.max(0,i-10);j--){
      const v=String(lines[j]||'').trim();
      if(trainerRe.test(v)){trainerIdx=j;break}
    }
    if(trainerIdx<0)continue;
    const cand=[];
    for(let j=Math.max(0,trainerIdx-7);j<trainerIdx;j++){
      let v=String(lines[j]||'').replace(/\s+Image(?:\s+Image)?$/,'').trim();
      if(!v||noiseRe.test(v)||/^\(.+\)$/.test(v)||/^\d+(?:\.\d+)?$/.test(v))continue;
      if(/^\d{1,2}\s+\d{1,2}(?:\s+\[Select\])?$/.test(v))continue;
      cand.push(v);
    }
    if(cand.length<2)continue;
    const horseName=cand.length>=3?cand[cand.length-2]:cand[0];
    let frame=null,num=null;
    for(let j=trainerIdx-1;j>=Math.max(0,trainerIdx-12);j--){
      const v=String(lines[j]||'').trim();
      let rm=v.match(/^([1-8])\s+([1-9]|1\d|2\d)(?:\s+(?:\[Select\]|--))?$/);
      if(rm){frame=Number(rm[1]);num=Number(rm[2]);break}
      if(/^([1-9]|1\d|2\d)$/.test(v)){
        const n=Number(v),prev=String(lines[j-1]||'').trim();
        if(/^[1-8]$/.test(prev)){frame=Number(prev);num=n;break}
      }
    }
    if(!num)num=out.length+1;
    jockey=resolveCardJockey(jockey.replace(/[▲△◇]/g,'').trim());
    out.push({frame,num,name:horseName,jockey,pop,odds,rank:null,sexAge});
  }
  return dedupe(out,r=>`${r.num}|${r.name}`);
}
function parseRaceCard(lines){
  const text=lines.join(' ').replace(/\s+/g,' ').trim();
  const out=[];
  const rowRe=/(?:^|\s)([1-8])\s+([1-9]|1\d|2\d)\s+(?:(?:--|\[Select\]|Select|印)\s+)*([^\s]+?)(?:\s+Image)?\s+((?:牡|牝|セ)\d+)\s+(\d{2,3}(?:\.\d)?)\s+([^\s]+)/g;
  const anchors=[];
  let m;
  while((m=rowRe.exec(text))){
    anchors.push({index:m.index,end:rowRe.lastIndex,frame:Number(m[1]),num:Number(m[2]),name:m[3],sexAge:m[4],burden:Number(m[5]),jockey:m[6]});
  }
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i];
    const block=text.slice(a.end,i+1<anchors.length?anchors[i+1].index:Math.min(text.length,a.end+260));
    let pop=null,odds=null;
    let om=block.match(/\b\d{3}(?:\([+-]?\d+\))?\s+(\d+(?:\.\d+)?)\s+(\d{1,2})(?:人気)?\b/);
    if(om){
      odds=Number(om[1]);
      const candidate=Number(om[2]);
      if(candidate>=1&&candidate<=20)pop=candidate;
    }
    if(pop==null){
      om=block.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*\((\d{1,2})人気\)/);
      if(om){odds=Number(om[1]);pop=Number(om[2]);}
    }
    if(pop==null){
      const pm=block.match(/(?:^|\s)(\d{1,2})人気(?:\s|$)/);
      if(pm)pop=Number(pm[1]);
    }
    out.push({frame:a.frame,num:a.num,name:a.name,jockey:a.jockey,pop,odds,rank:null,sexAge:a.sexAge});
  }
  return dedupe(out,r=>`${r.num}|${r.name}`);
}
function dedupe(arr,keyFn){const seen=new Set();return arr.filter(x=>{const k=keyFn(x);if(seen.has(k)) return false;seen.add(k);return true})}
function parseAll(raw){const lines=linesOf(raw);if(!lines.length)return {error:'入力が空です'};const meta=parseMeta(lines),resultRows=parseResultRows(lines);if(resultRows.length>=3)return {meta,mode:'result',rows:resultRows,lines,debug:{result:resultRows.length,past:0,card:0}};const pastRows=parsePastCard(lines);if(pastRows.length>=3)return {meta,mode:'card',rows:pastRows,lines,debug:{result:resultRows.length,past:pastRows.length,card:0}};const cardRows=parseRaceCard(lines);const mode=cardRows.length?'card':'unknown';return {meta,mode,rows:cardRows,lines,debug:{result:resultRows.length,past:pastRows.length,card:cardRows.length}};}
function dateNumber(s){const m=String(s||'').match(/(20\d{2})[\/.\-年](\d{1,2})[\/.\-月](\d{1,2})/);if(!m)return null;return Number(`${m[1]}${String(m[2]).padStart(2,'0')}${String(m[3]).padStart(2,'0')}`)}
function popularityBand(pop){const n=Number(pop);if(!Number.isFinite(n)||n<1)return '';return n===1?'1人気':n<=3?'2-3人気':n<=6?'4-6人気':'7人気以下'}
function jockeyHistoryBefore(jockey,targetDate){const target=dateNumber(targetDate);return (state.history||[]).filter(r=>{if(r.jockey!==jockey||!Number.isFinite(Number(r.rank)))return false;if(!target)return true;const d=dateNumber(r.date);return !d||d<target})}
function scoreRows(rows){const n=rows.length;if(!n)return null;let wins=0,places=0,popCount=0,popDiff=0;for(const r of rows){const rank=Number(r.rank);if(rank===1)wins++;if(rank<=3)places++;const pop=Number(r.pop);if(r.pop!==null&&r.pop!==''&&Number.isFinite(pop)&&pop>=1){popCount++;popDiff+=pop-rank}}const winRate=wins/n,placeRate=places/n;const resultScore=15+45*winRate+40*placeRate;let raw=resultScore;if(popCount){const avgDiff=popDiff/popCount;const popScore=Math.max(15,Math.min(85,50+avgDiff*7));raw=resultScore*0.65+popScore*0.35}const shrink=n/(n+5);const score=50+(raw-50)*shrink;return {score:Math.max(0,Math.min(100,score)),n,wins,places,popCount}}
function jockeySuitability(row,meta){if(!row?.jockey)return {score:null,label:'騎手不明',matchCount:0,total:0,reasons:[]};const all=jockeyHistoryBefore(row.jockey,meta?.date);if(!all.length)return {score:null,label:'未学習',matchCount:0,total:0,reasons:[]};const course=(meta?.surface||meta?.distance)?`${meta?.surface||'?'}${meta?.distance||'?'}m`:'';const band=popularityBand(row.pop);const factors=[{label:'競馬場',value:meta?.venue||'',weight:30,test:r=>(r.venue||'')===(meta?.venue||'')},{label:'コース',value:course,weight:30,test:r=>((r.surface||r.distance)?`${r.surface||'?'}${r.distance||'?'}m`:'')===course},{label:'馬場',value:meta?.going||'',weight:15,test:r=>(r.going||'')===(meta?.going||'')},{label:'人気帯',value:band,weight:15,test:r=>popularityBand(r.pop)===band},{label:'総合',value:'',weight:10,test:()=>true}];let weighted=0,weightSum=0;const matched=new Set();const reasons=[];for(const f of factors){if(f.label!=='総合'&&!f.value)continue;const rows=f.label==='総合'?all:all.filter(f.test);if(!rows.length)continue;const q=scoreRows(rows);if(!q)continue;weighted+=q.score*f.weight;weightSum+=f.weight;if(f.label!=='総合'){rows.forEach(x=>matched.add(x));reasons.push(`${f.value} ${rows.length}鞍`)}}if(!weightSum)return {score:null,label:'未学習',matchCount:0,total:all.length,reasons:[]};const score=weighted/weightSum;const matchCount=matched.size;let label='蓄積あり';if(all.length<3||matchCount<2)label='サンプル少';else if(all.length<10||matchCount<5)label='参考';return {score,label,matchCount,total:all.length,reasons}}
function scoreClass(score){if(score==null)return '';return score>=65?'scoreGood':score>=50?'scoreMid':'scoreLow'}
function renderPreview(p){const m=p.meta||{},modeLabel=p.mode==='result'?'結果ページ':p.mode==='card'?'出馬表':'未判定';let html=`<div class="meta"><div class="chip"><b>モード</b><br>${esc(modeLabel)}</div><div class="chip"><b>日付</b><br>${esc(m.date||'不明')}</div><div class="chip"><b>競馬場</b><br>${esc(m.venue||'不明')}</div><div class="chip"><b>R</b><br>${m.raceNo??'不明'}</div><div class="chip"><b>条件</b><br>${esc(`${m.surface||'?'}${m.distance||'?'}m ${m.going||''}`)}</div></div>`;if(!p.rows?.length){html+=`<p class="warn">馬データを認識できませんでした。</p>`;$('preview').innerHTML=html;return}if(p.mode==='card'){html+=`<p class="muted">騎手適性は保存済みの過去結果だけで計算します。50点前後が中立です。「サンプル少」は参考扱いです。</p>`;html+=`<div class="tablewrap"><table><thead><tr><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th><th>騎手適性</th><th>信頼度</th><th>今回の一致データ</th></tr></thead><tbody>`;html+=p.rows.map(r=>{const q=jockeySuitability(r,m);const scoreText=q.score==null?'--':Math.round(q.score);const reason=q.reasons.length?q.reasons.join(' / '):`過去 ${q.total}鞍・条件一致なし`;return `<tr><td>${r.num??''}</td><td>${esc(r.name)}</td><td>${esc(r.jockey)}</td><td>${r.pop??'-'}</td><td>${r.odds??'-'}</td><td class="scoreCell ${scoreClass(q.score)}">${scoreText}</td><td><span class="scoreFlag">${esc(q.label)}</span><div class="muted">過去${q.total}鞍 / 一致${q.matchCount}鞍</div></td><td class="scoreNote">${esc(reason)}</td></tr>`}).join('');html+=`</tbody></table></div>`}else{html+=`<div class="tablewrap"><table><thead><tr><th>着</th><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td>${r.rank??'-'}</td><td>${r.num??''}</td><td>${esc(r.name)}</td><td>${esc(r.jockey)}</td><td>${r.pop??'-'}</td><td>${r.odds??'-'}</td></tr>`).join('')}</tbody></table></div>`}$('preview').innerHTML=html}
function setStatus(msg,kind=''){$('status').className=`status ${kind}`;$('status').textContent=msg}
function saveParsedResult(auto=false){if(!parsed||parsed.mode!=='result'||!parsed.rows.length)return false;const m=parsed.meta||{};if(!m.venue||!m.raceNo||!m.date)return false;const key=[m.date,m.venue,m.raceNo].join('|');const obj={meta:m,rows:parsed.rows,savedAt:new Date().toISOString()};const idx=(state.races||[]).findIndex(r=>[r.meta?.date,r.meta?.venue,r.meta?.raceNo].join('|')===key);if(idx>=0)state.races[idx]=obj;else state.races.push(obj);rebuildHistory();renderDashboard();setStatus(`✓ ${auto?'自動保存・騎手反映':'保存'}しました: ${m.date} ${m.venue} ${m.raceNo}R / ${parsed.rows.length}頭`,'ok');return true}
function saveParsedCard(){if(!parsed||parsed.mode!=='card'||!parsed.rows.length)return false;const m=parsed.meta||{};if(!m.venue||!m.raceNo||!m.date)return false;if(!Array.isArray(state.raceCards))state.raceCards=[];const key=[m.date,m.venue,m.raceNo].join('|');const obj={meta:m,rows:parsed.rows,savedAt:new Date().toISOString()};const idx=state.raceCards.findIndex(r=>[r.meta?.date,r.meta?.venue,r.meta?.raceNo].join('|')===key);if(idx>=0)state.raceCards[idx]=obj;else state.raceCards.push(obj);persist();renderDashboard();const names=[...new Set(parsed.rows.map(r=>r.jockey).filter(Boolean))];setStatus(`✓ 出馬表として読取・騎手登録: ${m.date} ${m.venue} ${m.raceNo}R / ${parsed.rows.length}頭 / ${names.length}名\n成績は結果を読み取った時だけ加算します。`,'ok');return true}
$('parseBtn').addEventListener('click',()=>{parsed=parseAll($('raw').value);$('saveBtn').disabled=true;if(parsed.error){setStatus(parsed.error,'warn');$('preview').innerHTML='';return}renderPreview(parsed);const m=parsed.meta,okMeta=m.venue&&m.raceNo&&m.date,count=parsed.rows?.length||0;if(parsed.mode==='result'&&count>0){if(okMeta){saveParsedResult(true);$('saveBtn').disabled=false}else{setStatus(`✓ 結果として読取: ${m.date||'?'} ${m.venue||'?'} ${m.raceNo||'?'}R / ${count}頭\n日付・競馬場・Rのどれかが不明なため自動保存していません。`,'warn')}}else if(parsed.mode==='card'){if(okMeta){saveParsedCard()}else{setStatus(`✓ 出馬表として読取: ${m.date||'?'} ${m.venue||'?'} ${m.raceNo||'?'}R / ${count}頭\n日付・競馬場・Rのどれかが不明なため騎手登録していません。`,'warn')}}else{setStatus(`読取できませんでした。\n日付=${m.date||'?'} 競馬場=${m.venue||'?'} R=${m.raceNo||'?'} / 行数=${parsed.lines.length}\n結果候補=${parsed.debug?.result??0} / 馬柱候補=${parsed.debug?.past??0} / 通常出馬表候補=${parsed.debug?.card??0}`,'warn')}});
$('saveBtn').addEventListener('click',()=>{saveParsedResult(false)});
function pct(n,d){return d?`${(100*n/d).toFixed(1)}%`:'0.0%'}
function bucketAdd(obj,key,rank){if(!obj[key])obj[key]={rides:0,wins:0,places:0,rankSum:0};const x=obj[key];x.rides++;x.rankSum+=rank;if(rank===1)x.wins++;if(rank<=3)x.places++}
function jockeyStats(){const map=new Map();const ensure=name=>{if(name&&!map.has(name))map.set(name,{name,rides:0,wins:0,places:0,rankSum:0,venues:{},pops:{},popExact:{},courses:{},goings:{},popRides:0,popBetter:0,popEqual:0,popWorse:0,popDiffSum:0})};for(const card of state.raceCards||[])for(const r of card.rows||[])ensure(r.jockey);for(const r of state.history||[]){if(!r.jockey||!Number.isFinite(Number(r.rank))) continue;const k=r.jockey,rank=Number(r.rank);ensure(k);const x=map.get(k);x.rides++;x.rankSum+=rank;if(rank===1)x.wins++;if(rank<=3)x.places++;bucketAdd(x.venues,r.venue||'不明',rank);const course=(r.surface||r.distance)?`${r.surface||'?'}${r.distance||'?'}m`:'不明';bucketAdd(x.courses,course,rank);bucketAdd(x.goings,r.going||'不明',rank);const pop=Number(r.pop);if(r.pop!==null&&r.pop!==''&&Number.isFinite(pop)&&pop>=1){const band=pop===1?'1人気':pop<=3?'2-3人気':pop<=6?'4-6人気':'7人気以下';bucketAdd(x.pops,band,rank);bucketAdd(x.popExact,`${pop}人気`,rank);x.popRides++;x.popDiffSum+=pop-rank;if(rank<pop)x.popBetter++;else if(rank===pop)x.popEqual++;else x.popWorse++}}return [...map.values()].sort((a,b)=>b.rides-a.rides||b.wins-a.wins||a.name.localeCompare(b.name,'ja'))}
function avgRankText(x){return x.rides?(x.rankSum/x.rides).toFixed(2):'-'}
function patternTable(title,entries,label){const rows=entries.sort((a,b)=>b[1].rides-a[1].rides).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.rides}</td><td>${x.wins}</td><td>${pct(x.wins,x.rides)}</td><td>${x.places}</td><td>${pct(x.places,x.rides)}</td><td>${avgRankText(x)}</td></tr>`).join('');return `<div class="patternCard"><h4>${title}</h4><div class="tablewrap"><table><tr><th>${label}</th><th>騎乗</th><th>1着</th><th>勝率</th><th>3着内</th><th>複勝率</th><th>平均着順</th></tr>${rows||'<tr><td colspan="7">データなし</td></tr>'}</table></div></div>`}
function popularityExpectationCard(st){if(!st.popRides)return `<div class="patternCard"><h4>人気なり診断</h4><p class="muted">人気データのある結果がまだありません。</p></div>`;const atLeast=st.popBetter+st.popEqual;const diff=st.popDiffSum/st.popRides;const diffText=`${diff>0?'+':''}${diff.toFixed(2)}`;return `<div class="patternCard"><h4>人気なり診断</h4><p><b>対象 ${st.popRides}鞍</b></p><div class="tablewrap"><table><tr><th>判定</th><th>回数</th><th>率</th></tr><tr><td>人気より上の着順</td><td>${st.popBetter}</td><td>${pct(st.popBetter,st.popRides)}</td></tr><tr><td>人気どおり</td><td>${st.popEqual}</td><td>${pct(st.popEqual,st.popRides)}</td></tr><tr><td>人気より下の着順</td><td>${st.popWorse}</td><td>${pct(st.popWorse,st.popRides)}</td></tr><tr><td><b>人気以上</b></td><td><b>${atLeast}</b></td><td><b>${pct(atLeast,st.popRides)}</b></td></tr></table></div><p class="muted">平均人気差 ${diffText}。プラスほど、人気順位より上の着順へ持ってきています。</p></div>`}
function bestPattern(st){const all=[];for(const [type,obj] of [['競馬場',st.venues],['コース',st.courses],['馬場',st.goings],['人気帯',st.pops]])for(const [key,x] of Object.entries(obj))if(x.rides>=3)all.push({type,key,...x,score:(x.wins*2+x.places)/x.rides});return all.sort((a,b)=>b.score-a.score||b.rides-a.rides)[0]||null}
function renderJockeyDetail(name){const st=jockeyStats().find(x=>x.name===name);if(!st){$('jockeyDetail').textContent='騎手を選択してください。';return}const best=bestPattern(st);const popOrder=['1人気','2-3人気','4-6人気','7人気以下'];const popEntries=popOrder.filter(k=>st.pops[k]).map(k=>[k,st.pops[k]]);const exactPopEntries=Object.entries(st.popExact).sort((a,b)=>Number(a[0].replace('人気',''))-Number(b[0].replace('人気','')));$('jockeyDetail').innerHTML=`<h3>${esc(st.name)} ${best?`<span class="badge">得意候補 ${esc(best.type)}: ${esc(best.key)}</span>`:''}</h3><p><b>${st.rides}鞍</b> / 1着 ${st.wins}（${pct(st.wins,st.rides)}） / 3着内 ${st.places}（${pct(st.places,st.rides)}） / 平均着順 ${avgRankText(st)}</p><div class="patternGrid">${patternTable('競馬場別',Object.entries(st.venues),'競馬場')}${patternTable('コース・距離別',Object.entries(st.courses),'コース')}${patternTable('馬場別',Object.entries(st.goings),'馬場')}${patternTable('人気帯別',popEntries,'人気帯')}${patternTable('人気順位別',exactPopEntries,'人気')}${popularityExpectationCard(st)}</div>`}
function renderDashboard(){state=loadState();if(!Array.isArray(state.races))state.races=[];if(!Array.isArray(state.history))rebuildHistory();if(!Array.isArray(state.raceCards))state.raceCards=[];const stats=jockeyStats();$('raceCount').textContent=state.races.length;$('rideCount').textContent=(state.history||[]).length;$('jockeyCount').textContent=stats.length;$('jockeyBody').innerHTML=stats.length?stats.map(x=>`<tr class="clickrow" data-jockey="${esc(x.name)}"><td><b>${esc(x.name)}</b></td><td>${x.rides}</td><td>${x.wins}</td><td>${pct(x.wins,x.rides)}</td><td>${x.places}</td><td>${pct(x.places,x.rides)}</td><td>${avgRankText(x)}</td></tr>`).join(''):'<tr><td colspan="7">まだ登録された騎手がありません。</td></tr>';document.querySelectorAll('[data-jockey]').forEach(tr=>tr.addEventListener('click',()=>renderJockeyDetail(tr.dataset.jockey)));$('raceBody').innerHTML=state.races.length?[...state.races].sort((a,b)=>String(b.meta?.date||'').localeCompare(String(a.meta?.date||''))||Number(b.meta?.raceNo||0)-Number(a.meta?.raceNo||0)).map(r=>`<tr><td>${esc(r.meta?.date||'')}</td><td>${esc(r.meta?.venue||'')}</td><td>${r.meta?.raceNo??''}</td><td>${esc(r.meta?.raceName||'')}</td><td>${(r.rows||[]).length}</td></tr>`).join(''):'<tr><td colspan="5">保存レースはありません。</td></tr>';$('manageStatus').textContent=`保存レース: ${state.races.length} / 学習騎乗: ${(state.history||[]).length}（復元 ${(state.seedHistory||[]).length}） / 出馬表: ${state.raceCards.length}`}
function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shunten_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
$('exportBtn').addEventListener('click',downloadJSON);
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||typeof x!=='object')throw new Error();state=Object.assign(emptyState(),x);rebuildHistory();renderDashboard();$('manageStatus').textContent='✓ JSONを読み込みました。'}catch(err){$('manageStatus').textContent='JSONを読み込めませんでした。'}e.target.value=''});
$('deleteLastBtn').addEventListener('click',()=>{if(!state.races.length){$('manageStatus').textContent='削除するレースがありません。';return}const r=state.races.pop();rebuildHistory();renderDashboard();$('manageStatus').textContent=`最後のレースを削除しました: ${r.meta?.date||''} ${r.meta?.venue||''} ${r.meta?.raceNo??''}R`});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$(btn.dataset.view).classList.add('active');if(btn.dataset.view!=='inputView')renderDashboard()}));
$('clearBtn').addEventListener('click',()=>{$('raw').value='';$('preview').innerHTML='';parsed=null;$('saveBtn').disabled=true;setStatus('入力欄だけ消しました')});
(function boot(){const y=localStorage.getItem(YEAR_KEY)||new Date().getFullYear();$('year').value=y;$('year').addEventListener('change',e=>localStorage.setItem(YEAR_KEY,e.target.value));setStatus('✓ クリーン版 v4.14 起動。通常出馬表と馬柱(5走/9走)の両方に対応しました。','ok');renderDashboard()})();
</script>
