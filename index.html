<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鞍上パターン帳 × 瞬天 TGP ENGINE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f9;color:#18212b}header{background:#101820;color:#fff;padding:18px 20px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#b8c5d1}main{max-width:1180px;margin:20px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}textarea{width:100%;min-height:340px;padding:12px;border:1px solid #cbd3da;border-radius:8px;resize:vertical;font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#101820;color:#fff}.secondary{background:#e9eef2;color:#17202a}.status{margin-top:12px;padding:12px;border-radius:8px;background:#eef3f7;white-space:pre-wrap}.ok{color:#137944}.warn{color:#a05c00}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.chip{border:1px solid #dbe1e6;border-radius:8px;padding:10px;background:#fafbfc}.tablewrap{overflow:auto;max-height:520px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e7ebee;text-align:left;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0}.muted{color:#66727d;font-size:13px}input,select{padding:8px;border:1px solid #cbd3da;border-radius:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eef2;color:#17202a}.tab.active{background:#101820;color:#fff}.view{display:none}.view.active{display:block}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}.big{font-size:24px;font-weight:800}.clickrow{cursor:pointer}.clickrow:hover{background:#f2f6f8}.detailbox{margin-top:14px;padding:14px;background:#f7f9fa;border-radius:10px;border:1px solid #e0e5e9}.patternGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.patternCard{background:#fff;border:1px solid #dfe5ea;border-radius:10px;padding:12px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8eef3;font-size:12px;margin-left:6px}.strong{font-weight:800;color:#0d6b3f}
</style>
</head>
<body>
<header>
<h1>🏇 鞍上パターン帳 × 瞬天 TGP ENGINE</h1>
<p>クリーン版 v4.5：人気読取・人気別集計を修正</p>
</header>
<main>
<div class="tabs">
<button class="btn tab active" data-view="inputView">データ入力</button>
<button class="btn tab" data-view="jockeyView">騎手一覧</button>
<button class="btn tab" data-view="manageView">保存データ</button>
</div>
<section class="panel view active" id="inputView">
<h2>データ入力</h2>
<p>netkeiba / NAR の出馬表または結果ページを、そのまま貼り付けてください。</p>
<div class="row"><label>データ収集年 <input id="year" type="number" min="2000" max="2100" value="2026" style="width:100px"></label><span class="muted">MM/DDだけのページの日付補完に使います</span></div>
<textarea id="raw" placeholder="ここにページ全文を貼り付け"></textarea>
<div class="row"><button class="btn primary" id="parseBtn">今すぐ読み取る</button><button class="btn primary" id="saveBtn" disabled>この結果を保存</button><button class="btn secondary" id="clearBtn">入力だけ消す</button></div>
<div id="status" class="status">待機中</div><div id="preview"></div>
</section>
<section class="panel view" id="jockeyView">
<h2>騎手一覧</h2>
<div class="summary"><div class="chip"><b>保存レース</b><div class="big" id="raceCount">0</div></div><div class="chip"><b>学習騎乗</b><div class="big" id="rideCount">0</div></div><div class="chip"><b>登録騎手</b><div class="big" id="jockeyCount">0</div></div></div>
<p class="muted">騎手名をクリックすると、競馬場・コース距離・馬場・人気別のパターンを確認できます。</p>
<div class="tablewrap"><table><thead><tr><th>騎手</th><th>騎乗</th><th>1着</th><th>勝率</th><th>3着内</th><th>複勝率</th><th>平均着順</th></tr></thead><tbody id="jockeyBody"></tbody></table></div>
<div id="jockeyDetail" class="detailbox">騎手を選択してください。</div>
</section>
<section class="panel view" id="manageView">
<h2>保存データ</h2>
<div class="row"><button class="btn secondary" id="exportBtn">JSON書き出し</button><label class="btn secondary" style="display:inline-block">JSON読込<input type="file" id="importFile" accept="application/json,.json" style="display:none"></label><button class="btn secondary" id="deleteLastBtn">最後のレースを削除</button></div>
<div id="manageStatus" class="status">保存データを確認できます。</div>
<div class="tablewrap"><table><thead><tr><th>日付</th><th>競馬場</th><th>R</th><th>レース名</th><th>頭数</th></tr></thead><tbody id="raceBody"></tbody></table></div>
</section>
</main>
<script>
const KEY='jockeyPatternBook_v2';
const YEAR_KEY='jockeyPatternBook_collectionYear';
let parsed=null;
let state=loadState();
function emptyState(){return {history:[],races:[],horseHistory:[],raceCards:[],evaluations:[],model:{}}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?Object.assign(emptyState(),x):emptyState()}catch(e){return emptyState()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function rebuildHistory(){state.history=(state.races||[]).flatMap(r=>(r.rows||[]).map(x=>({...x,...(r.meta||{})})));persist()}
const $=id=>document.getElementById(id);
const linesOf=raw=>String(raw||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
const venues=['名古屋','園田','門別','船橋','大井','金沢','高知','佐賀','笠松','姫路','盛岡','水沢','浦和','川崎','帯広','札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function headerWindow(lines){let start=lines.findIndex(x=>x==='前');if(start<0) start=0;let end=lines.findIndex(x=>/発走/.test(x));if(end<0){end=Math.min(lines.length,160)}else{end=Math.min(lines.length,end+8)}return lines.slice(start,end)}
function parseDate(lines){const year=Number($('year').value)||new Date().getFullYear();const head=headerWindow(lines);const nav=[];for(const s of head){const m=s.match(/^(\d{1,2})\/(\d{1,2})\([^)]*\)$/);if(m) nav.push({month:+m[1],day:+m[2]})}if(nav.length){const pick=nav[Math.floor(nav.length/2)];return `${year}/${String(pick.month).padStart(2,'0')}/${String(pick.day).padStart(2,'0')}`}const full=head.join(' ').match(/(20\d{2})[.\/年](\d{1,2})[.\/月](\d{1,2})/);if(full){return `${full[1]}/${String(full[2]).padStart(2,'0')}/${String(full[3]).padStart(2,'0')}`}return ''}
function parseRaceNo(lines){const head=headerWindow(lines);const idx12=head.findIndex(x=>x==='12R');if(idx12>=0){for(let i=idx12+1;i<Math.min(head.length,idx12+20);i++){if(/^\d{1,2}R$/.test(head[i])) return Number(head[i].slice(0,-1))}}for(let i=0;i<head.length;i++){if(/^\d{1,2}R$/.test(head[i])&&head.slice(i+1,i+4).some(x=>/発走/.test(x))) return Number(head[i].slice(0,-1))}return null}
function parseVenue(lines){const head=headerWindow(lines);for(const s of head){const m=s.match(new RegExp(`^\\d+回\\s+(${venues.join('|')})\\s+\\d+日目`));if(m) return m[1]}const hi=head.findIndex(x=>/発走/.test(x));const near=hi>=0?head.slice(Math.max(0,hi-8),Math.min(head.length,hi+8)):head.slice(0,80);for(const s of near){if(venues.includes(s)) return s}return ''}
function parseMeta(lines){const head=headerWindow(lines),joined=head.join(' '),hi=head.findIndex(x=>/発走/.test(x));const sd=joined.match(/(?:^|\s)(芝|ダ|障)\s*(\d{3,4})m/);const going=(joined.match(/(?:馬場|馬場状態)[:：]?\s*(良|稍重|重|不良|稍|不)/)||[])[1]||'';let raceName='';if(hi>0){for(let i=hi-1;i>=Math.max(0,hi-4);i--){const s=head[i];if(!/^\d{1,2}R$/.test(s)&&!/^(前|次|本日へ)$/.test(s)){raceName=s;break}}}return {date:parseDate(lines),venue:parseVenue(lines),raceNo:parseRaceNo(lines),surface:sd?sd[1]:'',distance:sd?Number(sd[2]):null,going,raceName}}
function isSexAge(s){return /^(牡|牝|セ)\d+/.test(s)}
function looksJockey(s){return s&&!/^\d/.test(s)&&!/(映像を見る|着差|タイム|人気|馬体重)/.test(s)}
function parseResultRows(lines){
  const out=[];
  for(let i=0;i<lines.length-7;i++){
    if(!/^\d{1,2}$/.test(lines[i])) continue;
    const rank=Number(lines[i]);if(rank<1||rank>30) continue;
    let p=i+1;
    if(/^\d$/.test(lines[p])) p++;
    if(!/^\d{1,2}$/.test(lines[p])) continue;
    const num=Number(lines[p++]),name=lines[p++],sexAge=lines[p++];
    if(!name||!isSexAge(sexAge)) continue;
    const burden=lines[p++],jockey=lines[p++];
    if(!/^\d{2,3}(?:\.\d)?$/.test(burden)||!looksJockey(jockey)) continue;
    let pop=null,odds=null,time='',timeIndex=-1;
    const end=Math.min(lines.length,p+18);
    for(let j=p;j<end;j++){
      if(!time&&/^\d+:\d{2}(?:\.\d)?$/.test(lines[j])){time=lines[j];timeIndex=j}
      let m=lines[j].match(/^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/);
      if(m){odds=Number(m[1]);pop=Number(m[2]);break}
      m=lines[j].match(/^(\d+)人気$/);
      if(m&&pop==null) pop=Number(m[1]);
    }
    if(timeIndex>=0){
      for(let j=timeIndex+1;j<Math.min(end,timeIndex+7);j++){
        if(!/^\d{1,2}$/.test(lines[j])) continue;
        const candidate=Number(lines[j]);
        if(candidate<1||candidate>30) continue;
        const next=lines[j+1]||'';
        if(/^\d+(?:\.\d+)$/.test(next)){
          pop=candidate;odds=Number(next);break;
        }
      }
    }
    out.push({rank,num,name,jockey,pop,odds,time});i=p-1;
  }
  return dedupe(out,r=>`${r.rank}|${r.num}|${r.name}`);
}
function parseRaceCard(lines){
  const out=[];const start=Math.max(0,lines.findIndex(x=>/発走/.test(x)));
  for(let i=start;i<lines.length-8;i++){
    const m=lines[i].match(/^([1-8])\s+([1-9]|1\d|2\d)\s*$/);if(!m) continue;
    const frame=+m[1],num=+m[2];let p=i+1;if(lines[p]==='--') p++;
    const name=lines[p++];if(!name||/^(取消|除外|中止)$/.test(name)) continue;
    let pop=null,odds=null,sexAge='',jockey='';
    for(let j=p;j<Math.min(lines.length,p+18);j++){
      let pm=lines[j].match(/^(\d+(?:\.\d+)?)\s*\((\d+)人気\)$/);
      if(pm){odds=Number(pm[1]);pop=Number(pm[2])}
      pm=lines[j].match(/^(\d+)人気$/);
      if(pm&&pop==null) pop=Number(pm[1]);
      if(/^\d+(?:\.\d+)$/.test(lines[j])&&/^(\d+)人気$/.test(lines[j+1]||'')){
        odds=Number(lines[j]);pop=Number((lines[j+1].match(/^(\d+)人気$/)||[])[1]);
      }
      if(!sexAge&&/^(牡|牝|セ)\d+/.test(lines[j])) sexAge=lines[j];
      if(sexAge&&!jockey&&j>p&&looksJockey(lines[j])&&/^\d{2,3}(?:\.\d)?$/.test(lines[j+1]||'')) jockey=lines[j];
    }
    if(name&&(sexAge||jockey)) out.push({frame,num,name,jockey,pop,odds,rank:null});
  }
  return dedupe(out,r=>`${r.num}|${r.name}`);
}
function dedupe(arr,keyFn){const seen=new Set();return arr.filter(x=>{const k=keyFn(x);if(seen.has(k)) return false;seen.add(k);return true})}
function parseAll(raw){const lines=linesOf(raw);if(!lines.length)return {error:'入力が空です'};const meta=parseMeta(lines),resultRows=parseResultRows(lines),cardRows=resultRows.length>=3?[]:parseRaceCard(lines),mode=resultRows.length>=3?'result':cardRows.length?'card':'unknown';return {meta,mode,rows:mode==='result'?resultRows:cardRows,lines}}
function renderPreview(p){const m=p.meta||{},modeLabel=p.mode==='result'?'結果ページ':p.mode==='card'?'出馬表':'未判定';let html=`<div class="meta"><div class="chip"><b>モード</b><br>${esc(modeLabel)}</div><div class="chip"><b>日付</b><br>${esc(m.date||'不明')}</div><div class="chip"><b>競馬場</b><br>${esc(m.venue||'不明')}</div><div class="chip"><b>R</b><br>${m.raceNo??'不明'}</div><div class="chip"><b>条件</b><br>${esc(`${m.surface||'?'}${m.distance||'?'}m ${m.going||''}`)}</div></div>`;if(p.rows?.length){html+=`<div class="tablewrap"><table><thead><tr><th>着</th><th>馬番</th><th>馬名</th><th>騎手</th><th>人気</th><th>単勝</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td>${r.rank??'-'}</td><td>${r.num??''}</td><td>${esc(r.name)}</td><td>${esc(r.jockey)}</td><td>${r.pop??'-'}</td><td>${r.odds??'-'}</td></tr>`).join('')}</tbody></table></div>`}else html+=`<p class="warn">馬データを認識できませんでした。</p>`;$('preview').innerHTML=html}
function setStatus(msg,kind=''){$('status').className=`status ${kind}`;$('status').textContent=msg}
function saveParsedResult(auto=false){if(!parsed||parsed.mode!=='result'||!parsed.rows.length)return false;const m=parsed.meta||{};if(!m.venue||!m.raceNo||!m.date)return false;const key=[m.date,m.venue,m.raceNo].join('|');const obj={meta:m,rows:parsed.rows,savedAt:new Date().toISOString()};const idx=(state.races||[]).findIndex(r=>[r.meta?.date,r.meta?.venue,r.meta?.raceNo].join('|')===key);if(idx>=0)state.races[idx]=obj;else state.races.push(obj);rebuildHistory();renderDashboard();setStatus(`✓ ${auto?'自動保存・騎手反映':'保存'}しました: ${m.date} ${m.venue} ${m.raceNo}R / ${parsed.rows.length}頭`,'ok');return true}
function saveParsedCard(){if(!parsed||parsed.mode!=='card'||!parsed.rows.length)return false;const m=parsed.meta||{};if(!m.venue||!m.raceNo||!m.date)return false;if(!Array.isArray(state.raceCards))state.raceCards=[];const key=[m.date,m.venue,m.raceNo].join('|');const obj={meta:m,rows:parsed.rows,savedAt:new Date().toISOString()};const idx=state.raceCards.findIndex(r=>[r.meta?.date,r.meta?.venue,r.meta?.raceNo].join('|')===key);if(idx>=0)state.raceCards[idx]=obj;else state.raceCards.push(obj);persist();renderDashboard();const names=[...new Set(parsed.rows.map(r=>r.jockey).filter(Boolean))];setStatus(`✓ 出馬表として読取・騎手登録: ${m.date} ${m.venue} ${m.raceNo}R / ${parsed.rows.length}頭 / ${names.length}名\n成績は結果を読み取った時だけ加算します。`,'ok');return true}
$('parseBtn').addEventListener('click',()=>{parsed=parseAll($('raw').value);$('saveBtn').disabled=true;if(parsed.error){setStatus(parsed.error,'warn');$('preview').innerHTML='';return}renderPreview(parsed);const m=parsed.meta,okMeta=m.venue&&m.raceNo&&m.date,count=parsed.rows?.length||0;if(parsed.mode==='result'&&count>0){if(okMeta){saveParsedResult(true);$('saveBtn').disabled=false}else{setStatus(`✓ 結果として読取: ${m.date||'?'} ${m.venue||'?'} ${m.raceNo||'?'}R / ${count}頭\n日付・競馬場・Rのどれかが不明なため自動保存していません。`,'warn')}}else if(parsed.mode==='card'){if(okMeta){saveParsedCard()}else{setStatus(`✓ 出馬表として読取: ${m.date||'?'} ${m.venue||'?'} ${m.raceNo||'?'}R / ${count}頭\n日付・競馬場・Rのどれかが不明なため騎手登録していません。`,'warn')}}else{setStatus(`読取できませんでした。\n日付=${m.date||'?'} 競馬場=${m.venue||'?'} R=${m.raceNo||'?'} / 行数=${parsed.lines.length}`,'warn')}});
$('saveBtn').addEventListener('click',()=>{saveParsedResult(false)});
function pct(n,d){return d?`${(100*n/d).toFixed(1)}%`:'0.0%'}
function bucketAdd(obj,key,rank){if(!obj[key])obj[key]={rides:0,wins:0,places:0,rankSum:0};const x=obj[key];x.rides++;x.rankSum+=rank;if(rank===1)x.wins++;if(rank<=3)x.places++}
function jockeyStats(){const map=new Map();const ensure=name=>{if(name&&!map.has(name))map.set(name,{name,rides:0,wins:0,places:0,rankSum:0,venues:{},pops:{},courses:{},goings:{}})};for(const card of state.raceCards||[])for(const r of card.rows||[])ensure(r.jockey);for(const r of state.history||[]){if(!r.jockey||!Number.isFinite(Number(r.rank))) continue;const k=r.jockey,rank=Number(r.rank);ensure(k);const x=map.get(k);x.rides++;x.rankSum+=rank;if(rank===1)x.wins++;if(rank<=3)x.places++;bucketAdd(x.venues,r.venue||'不明',rank);const course=(r.surface||r.distance)?`${r.surface||'?'}${r.distance||'?'}m`:'不明';bucketAdd(x.courses,course,rank);bucketAdd(x.goings,r.going||'不明',rank);const pop=Number(r.pop);if(r.pop!==null&&r.pop!==''&&Number.isFinite(pop)&&pop>=1){const b=pop===1?'1人気':pop<=3?'2-3人気':pop<=6?'4-6人気':'7人気以下';bucketAdd(x.pops,b,rank)}}return [...map.values()].sort((a,b)=>b.rides-a.rides||b.wins-a.wins||a.name.localeCompare(b.name,'ja'))}
function avgRankText(x){return x.rides?(x.rankSum/x.rides).toFixed(2):'-'}
function patternTable(title,entries,label){const rows=entries.sort((a,b)=>b[1].rides-a[1].rides).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.rides}</td><td>${x.wins}</td><td>${pct(x.wins,x.rides)}</td><td>${x.places}</td><td>${pct(x.places,x.rides)}</td><td>${avgRankText(x)}</td></tr>`).join('');return `<div class="patternCard"><h4>${title}</h4><div class="tablewrap"><table><tr><th>${label}</th><th>騎乗</th><th>1着</th><th>勝率</th><th>3着内</th><th>複勝率</th><th>平均着順</th></tr>${rows||'<tr><td colspan="7">データなし</td></tr>'}</table></div></div>`}
function bestPattern(st){const all=[];for(const [type,obj] of [['競馬場',st.venues],['コース',st.courses],['馬場',st.goings],['人気',st.pops]])for(const [key,x] of Object.entries(obj))if(x.rides>=3)all.push({type,key,...x,score:(x.wins*2+x.places)/x.rides});return all.sort((a,b)=>b.score-a.score||b.rides-a.rides)[0]||null}
function renderJockeyDetail(name){const st=jockeyStats().find(x=>x.name===name);if(!st){$('jockeyDetail').textContent='騎手を選択してください。';return}const best=bestPattern(st);const popOrder=['1人気','2-3人気','4-6人気','7人気以下'];const popEntries=popOrder.filter(k=>st.pops[k]).map(k=>[k,st.pops[k]]);$('jockeyDetail').innerHTML=`<h3>${esc(st.name)} ${best?`<span class="badge">得意候補 ${esc(best.type)}: ${esc(best.key)}</span>`:''}</h3><p><b>${st.rides}鞍</b> / 1着 ${st.wins}（${pct(st.wins,st.rides)}） / 3着内 ${st.places}（${pct(st.places,st.rides)}） / 平均着順 ${avgRankText(st)}</p><div class="patternGrid">${patternTable('競馬場別',Object.entries(st.venues),'競馬場')}${patternTable('コース・距離別',Object.entries(st.courses),'コース')}${patternTable('馬場別',Object.entries(st.goings),'馬場')}${patternTable('人気別',popEntries,'人気')}</div>`}
function renderDashboard(){state=loadState();if(!Array.isArray(state.races))state.races=[];if(!Array.isArray(state.history))rebuildHistory();if(!Array.isArray(state.raceCards))state.raceCards=[];const stats=jockeyStats();$('raceCount').textContent=state.races.length;$('rideCount').textContent=(state.history||[]).length;$('jockeyCount').textContent=stats.length;$('jockeyBody').innerHTML=stats.length?stats.map(x=>`<tr class="clickrow" data-jockey="${esc(x.name)}"><td><b>${esc(x.name)}</b></td><td>${x.rides}</td><td>${x.wins}</td><td>${pct(x.wins,x.rides)}</td><td>${x.places}</td><td>${pct(x.places,x.rides)}</td><td>${avgRankText(x)}</td></tr>`).join(''):'<tr><td colspan="7">まだ登録された騎手がありません。</td></tr>';document.querySelectorAll('[data-jockey]').forEach(tr=>tr.addEventListener('click',()=>renderJockeyDetail(tr.dataset.jockey)));$('raceBody').innerHTML=state.races.length?[...state.races].sort((a,b)=>String(b.meta?.date||'').localeCompare(String(a.meta?.date||''))||Number(b.meta?.raceNo||0)-Number(a.meta?.raceNo||0)).map(r=>`<tr><td>${esc(r.meta?.date||'')}</td><td>${esc(r.meta?.venue||'')}</td><td>${r.meta?.raceNo??''}</td><td>${esc(r.meta?.raceName||'')}</td><td>${(r.rows||[]).length}</td></tr>`).join(''):'<tr><td colspan="5">保存レースはありません。</td></tr>';$('manageStatus').textContent=`保存レース: ${state.races.length} / 学習騎乗: ${(state.history||[]).length} / 出馬表: ${state.raceCards.length}`}
function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shunten_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
$('exportBtn').addEventListener('click',downloadJSON);
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||typeof x!=='object')throw new Error();state=Object.assign(emptyState(),x);rebuildHistory();renderDashboard();$('manageStatus').textContent='✓ JSONを読み込みました。'}catch(err){$('manageStatus').textContent='JSONを読み込めませんでした。'}e.target.value=''});
$('deleteLastBtn').addEventListener('click',()=>{if(!state.races.length){$('manageStatus').textContent='削除するレースがありません。';return}const r=state.races.pop();rebuildHistory();renderDashboard();$('manageStatus').textContent=`最後のレースを削除しました: ${r.meta?.date||''} ${r.meta?.venue||''} ${r.meta?.raceNo??''}R`});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));btn.classList.add('active');$(btn.dataset.view).classList.add('active');if(btn.dataset.view!=='inputView')renderDashboard()}));
$('clearBtn').addEventListener('click',()=>{$('raw').value='';$('preview').innerHTML='';parsed=null;$('saveBtn').disabled=true;setStatus('入力欄だけ消しました')});
(function boot(){const y=localStorage.getItem(YEAR_KEY)||new Date().getFullYear();$('year').value=y;$('year').addEventListener('change',e=>localStorage.setItem(YEAR_KEY,e.target.value));setStatus('✓ クリーン版 v4.5 起動。人気読取と人気別集計を修正しました。','ok');renderDashboard()})();
</script>
</body>
</html>
